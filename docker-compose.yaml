services:

  # ── LLM: Gemma 4 26B en GPU 0 + GPU 1 (RTX 4000 Ada, 20 GB cada una) ──────
  # tensor-parallel-size 2 → 40 GB combinados permiten fp8 (~26 GB de pesos) y
  # dejan VRAM libre para KV-cache. Con --kv-cache-dtype fp8 ese KV rinde el
  # doble, habilitando ventana de ~96 K tokens con 2 secuencias concurrentes.
  # vLLM usa continuous batching: gestiona internamente todas las peticiones
  # concurrentes, maximizando la utilización de ambas GPUs simultáneamente.
  #
  # Configuración orientada a: 2 usuarios en paralelo con contexto amplio.
  # ──────────────────────────────────────────────────────────────────────────
  vllm-llm:
    build:
      context: .
      dockerfile: Dockerfile.vLLM
    command:
      - google/gemma-4-26B-A4B-it
      - --served-model-name
      - gemma-4-26b
      - --port
      - "8000"
      - --tensor-parallel-size
      - "2"
      - --quantization
      - fp8
      # KV-cache en fp8 (1 byte/token): ~MITAD de memoria por token vs bf16.
      # Es la palanca principal que permite subir max-model-len sin más VRAM.
      - --kv-cache-dtype
      - fp8
      - --gpu-memory-utilization
      - "0.93"
      # Subido de 49152 -> 98304. Al bajar max-num-seqs de 4 a 2, cada secuencia
      # dispone de ~el doble de bloques KV, así que podemos duplicar la ventana.
      # ⚠️ NO puede superar el max_position_embeddings nativo del modelo
      # (Gemma 4 soporta hasta 262144, así que 98304 está holgado).
      - --max-model-len
      - "131072"
      # Bajado de 4 -> 2: priorizamos que 2 personas trabajen en paralelo con
      # contexto amplio. El exceso de peticiones simplemente hace cola.
      - --max-num-seqs
      - "2"
      - --max-num-batched-tokens
      - "4096"
      # Con max-num-batched-tokens (4096) < max-model-len el prefill se procesa
      # por trozos; lo activamos explícitamente para no depender del default.
      - --enable-chunked-prefill
      # - --enforce-eager
      - --trust-remote-code
      - --enable-auto-tool-choice
      - --tool-call-parser
      - gemma4
    ports:
      - "8002:8000"
    volumes:
      - /home/aiteam/.cache/huggingface:/root/.cache/huggingface
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0", "1"]
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 300s
    restart: unless-stopped
    networks:
      - vllm-net

networks:
  vllm-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.50.0.0/16


